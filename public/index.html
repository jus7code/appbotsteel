<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BotSim</title>
  <link rel="stylesheet" href="css/style.css?v=dev">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="loading">Cargando modelo… <span id="progress">0%</span></div>

  <div id="toolbar">
    <button id="btn-camera" disabled>Iniciar cámara</button>
    <label><input type="checkbox" id="chk-mirror" checked> Modo espejo</label>
    <span id="status" class="status off">Cámara apagada</span>
    <button id="btn-settings" class="ghost" title="Ajustes">⚙</button>
  </div>

  <div id="settings" class="panel hidden">
    <fieldset>
      <legend>Partes del cuerpo</legend>
      <label><input type="checkbox" data-group="arms" checked> Brazos</label>
      <label><input type="checkbox" data-group="hands"> Muñecas (experimental)</label>
      <label><input type="checkbox" data-group="legs" checked> Piernas</label>
      <label><input type="checkbox" data-group="torso" checked> Torso</label>
      <label><input type="checkbox" data-group="head" checked> Cabeza</label>
    </fieldset>
    <label class="range">Suavizado <input type="range" id="rng-smooth" min="0" max="0.9" step="0.05" value="0.9"><output id="out-smooth">0.90</output></label>
    <label><input type="checkbox" id="chk-skeleton" checked> Dibujar esqueleto en el vídeo</label>
  </div>

  <div id="error" class="panel error hidden"></div>

  <div id="cam-box" class="hidden">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <span id="fps"></span>
  </div>

  <script type="module" src="js/main.js?v=dev"></script>
</body>
</html>
