<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BotSim</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="loading">Cargando modelo… <span id="progress">0%</span></div>

  <div id="toolbar">
    <button id="btn-camera" disabled>Iniciar cámara</button>
    <label><input type="checkbox" id="chk-mirror" checked> Modo espejo</label>
    <span id="status" class="status off">Cámara apagada</span>
  </div>

  <div id="cam-box" class="hidden">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <span id="fps"></span>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
