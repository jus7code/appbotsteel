# BotSim: sitio estático detrás del túnel de Cloudflare (botsim.traumado.top -> http://localhost:8080)
server {
    listen 127.0.0.1:8080;
    server_name botsim.traumado.top localhost;

    root /var/www/botsim;
    index index.html;

    # El modelo y las texturas se comprimen bien con gzip
    gzip on;
    gzip_types application/javascript text/css model/gltf-binary application/octet-stream;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML, JS y CSS: el navegador y Cloudflare siempre revalidan (ETag), así un cambio se ve al recargar
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
    }

    # El GLB cambia muy poco: caché de 1 día
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=86400" always;
    }

    access_log /var/log/nginx/botsim.access.log;
    error_log  /var/log/nginx/botsim.error.log;
}
